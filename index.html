<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云数据中心资源调度模拟器</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 引入ECharts用于可视化 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <h1>☁️ 云数据中心资源调度模拟器</h1>
            <p>郑州大学 | 信息安全专业 | 职业生涯规划课程项目</p>
        </header>

        <!-- 控制面板 -->
        <section class="control-panel">
            <div class="panel-section">
                <h2>🏗️ 物理机管理</h2>
                <div id="pm-list" class="pm-grid"></div>
                <button onclick="addPhysicalMachine()" class="btn btn-primary">+ 添加物理机</button>
            </div>

            <div class="panel-section">
                <h2>📝 任务提交</h2>
                <form id="task-form">
                    <input type="text" id="task-name" placeholder="任务名称" required>
                    <input type="number" id="task-cpu" placeholder="CPU需求(核)" min="1" required>
                    <input type="number" id="task-mem" placeholder="内存需求(GB)" min="1" required>
                    <input type="number" id="task-duration" placeholder="运行时长(秒)" min="1" required>
                    <select id="task-priority">
                        <option value="1">低优先级</option>
                        <option value="2">中优先级</option>
                        <option value="3">高优先级</option>
                    </select>
                    <button type="submit" class="btn btn-success">提交任务</button>
                </form>
            </div>

            <div class="panel-section">
                <h2>⚙️ 调度算法</h2>
                <select id="algorithm-select">
                    <option value="fcfs">先来先服务 (FCFS)</option>
                    <option value="sjf">最短作业优先 (SJF)</option>
                    <option value="best-fit">最佳适应 (Best Fit)</option>
                </select>
                <button onclick="startSimulation()" class="btn btn-warning">▶ 开始模拟</button>
                <button onclick="resetSimulation()" class="btn btn-danger">⏹ 重置</button>
            </div>
        </section>

        <!-- 可视化面板 -->
        <section class="visualization">
            <div class="viz-panel">
                <h2>📊 资源监控</h2>
                <div id="resource-chart" style="width: 100%; height: 400px;"></div>
            </div>
            
            <div class="viz-panel">
                <h2>📋 任务队列</h2>
                <div id="task-queue"></div>
            </div>
        </section>

        <!-- 性能统计 -->
        <section class="statistics">
            <h2>📈 性能指标</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">CPU平均利用率</span>
                    <span class="stat-value" id="cpu-usage">0%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">内存平均利用率</span>
                    <span class="stat-value" id="mem-usage">0%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">平均等待时间</span>
                    <span class="stat-value" id="avg-wait">0s</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">任务吞吐量</span>
                    <span class="stat-value" id="throughput">0</span>
                </div>
            </div>
        </section>

        <!-- 日志面板 -->
        <section class="logs">
            <h2>📝 调度日志</h2>
            <div id="log-container"></div>
        </section>
    </div>

    <script src="js/config.js"></script>
    <script src="js/scheduler.js"></script>
    <script src="js/visualization.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
